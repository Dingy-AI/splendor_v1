[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "splendor-rust-v2"
version = "0.2.0"
requires-python = ">=3.10,<3.15"
description = "Compatible native execution engine for Splendor Model 4"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "splendor_rust_v2"
