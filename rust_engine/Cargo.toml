[package]
name = "splendor-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[lib]
name = "splendor_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.27.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["python"]
python = ["dep:pyo3"]

[profile.release]
lto = "thin"
codegen-units = 1
